<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Monst UI Guide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="menu-btn" type="button" aria-controls="drawer" aria-expanded="false">☰ Pages</button>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="tools">
    <span id="ver"></span>
    <button id="taps-btn" type="button" aria-pressed="false">Show tap areas</button>
  </div>
</header>

<div id="backdrop" hidden></div>
<aside id="drawer" aria-label="All pages" hidden>
  <input id="search" type="search" placeholder="Jump to… (e.g. Backup, Quest)" autocomplete="off" aria-label="Search pages and items">
  <div id="list"></div>
</aside>

<div id="overlay" hidden>
  <div id="ov-box" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div id="ov-head"><h2 id="ov-title"></h2><button id="ov-close" type="button">Close</button></div>
    <div id="ov-body"></div>
  </div>
</div>

<main id="page">
  <div id="shot"><svg id="popup-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2825" preserveAspectRatio="none" hidden></svg><div id="toggle" role="group" aria-label="Version" hidden></div><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>
  <section id="panel" aria-label="Explanations"></section>
</main>

<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
