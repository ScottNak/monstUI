<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Monst UI Guide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="menu-btn" type="button" aria-controls="drawer" aria-expanded="false">☰ Pages</button>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="tools">
    <span id="ver"></span>
    <button id="taps-btn" type="button" aria-pressed="false">Show tap areas</button>
  </div>
</header>

<div id="backdrop" hidden></div>
<aside id="drawer" aria-label="All pages" hidden>
  <input id="search" type="search" placeholder="Jump to… (e.g. Backup, Quest)" autocomplete="off" aria-label="Search pages and items">
  <div id="list"></div>
</aside>

<main id="page">
  <div id="shot"><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>
  <section id="panel" aria-label="Explanations"></section>
</main>

<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
